plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.jarod85.litesocial'
version = '2.0.0'

android {
  namespace "com.jarod85.litesocial.alerts"
  defaultConfig {
    versionCode 2
    versionName '2.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
  // Runs the periodic check in the background and survives restarts and reboots.
  implementation 'androidx.work:work-runtime:2.11.2'

  // JVM tests of the inbox parsing (src/test); org.json replaces Android's stub of it there.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
